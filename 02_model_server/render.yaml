# Render "Blueprint": creates the web service from this repository in one step
services:
  - type: web
    name: hackathon-team6-cubicasa
    runtime: python
    plan: free
    region: frankfurt
    rootDir: 02_model_server
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /

    # For an approved v4 rollout, make the complete bundle available on the host
    # and set LAYOUT_BUNDLE_DIR to its directory in Render before restarting.
