# Team 6 app on Cloudflare Pages: the page (public/) + the API (functions/) + D1 database + R2 bucket
name = "hackathon-team6-cubicasa-app"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

# Plain settings, readable by the functions as env.MODEL_URL
[vars]
# Our model server on Render (02_model_server/), without a slash at the end
MODEL_URL = "https://hackathon-team6-cubicasa.onrender.com"
MODEL_API_NAME = "predict_model"   # the plan + the version the user chose (v1, v2 or v3)

# The database: one row per search (schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "hackathon-team6-db"
database_id = "1cf4c5cf-6131-4ddd-aa39-353989640fdd"

# File storage: the uploaded plans and the full answer of each search
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "hackathon-team6-plans"

# The password is NOT here: it is a secret.
# Local:   put APP_PASSWORD=... in a .dev.vars file (never commit it)
# Online:  npx wrangler pages secret put APP_PASSWORD
